# Set 24 bit color
set-option -sa terminal-overrides ",xterm*:Tc"

# Set r to reload the tmux configuration file
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Set prefix to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Set i to install
unbind i
bind i run '~/.config/tmux/plugins/tpm/bin/install_plugins'

# Set mouse on
set -g mouse on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Session persistence:
# - resurrect: prefix + Ctrl-s saves, prefix + Ctrl-r restores
# - continuum: auto-save every 15 min, auto-restore last save on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
