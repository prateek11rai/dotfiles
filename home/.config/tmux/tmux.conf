# Set 24 bit color
set-option -sa terminal-overrides ",xterm*:Tc"

# Set r to reload the tmux configuration file
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Set prefix to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Set i to install
unbind i
bind i run '~/.config/tmux/plugins/tpm/bin/install_plugins'

# Set mouse on
set -g mouse on

# Forward terminal focus events to programs inside tmux (Neovim autoread, cursor shape, etc.)
set -g focus-events on

# Claude Code in tmux: pass notifications/progress through to the outer terminal, and
# distinguish Shift-Enter from Enter. code.claude.com/docs/en/terminal-config#configure-tmux
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Session management
# prefix + N: create a new session, prompting for its name up front (name + create in one step)
bind N command-prompt -p "New session name:" "new-session -s '%%'"
# prefix + S: rename the current session (pre-filled with the current name)
bind S command-prompt -I "#S" -p "Rename session:" "rename-session '%%'"
# (built-in: prefix + s opens the interactive session switcher)

# When a session is destroyed, switch to another session instead of detaching to the
# terminal; only detach if there are no other sessions left.
set -g detach-on-destroy no-detached
# prefix + X: kill the current session (moves you to another session, if any)
bind X confirm-before -p "Kill session '#S'? (y/n)" kill-session

# tpm, resurrect and continuum all shell out to `tmux`, but a server started by a GUI app
# inherits a PATH without it, which silently breaks every plugin. Derive the running
# server's own binary dir instead of hardcoding an install prefix.
run-shell 'B=$(readlink "/proc/#{pid}/exe" 2>/dev/null || ps -o comm= -p #{pid} 2>/dev/null); D=${B%/*}; \
  [ -x "$B" ] || exit 0; \
  case ":$PATH:" in *":$D:"*) exit 0;; esac; \
  "$B" set-environment -g PATH "$D:$PATH"'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Session persistence:
# - resurrect: prefix + Ctrl-s saves, prefix + Ctrl-r restores
# - continuum: auto-save every 15 min, auto-restore last save on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
